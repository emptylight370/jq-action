name: Run jq
author: emptylight
description: Run jq on input file and return jq outputs

inputs:
  data:
    description: Run jq on this file or json string.
    required: true

  filter:
    description: The jq selector. see https://jqlang.org/manual/#basic-filters
    required: true

  raw:
    default: "true"
    description: Raw output, not json string. In complex output, set to false and manually parse the JSON string. Only "true" means `-r`.
    required: false

  options:
    description: The options to append to jq command. see https://jqlang.org/manual/#invoking-jq
    required: false

outputs:
  result:
    description: The jq result.
    value: ${{ steps.runjq.outputs.result }}

  multiline:
    description: Whether the jq result is multiline.
    value: ${{ steps.runjq.outputs.multiline }}

runs:
  # For more on composite actions, see:
  # https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
  using: composite
  steps:
    - id: runjq
      shell: bash
      env:
        INPUT_RAW: ${{ inputs.raw }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_DATA: ${{ inputs.data }}
        INPUT_FILTER: ${{ inputs.filter }}
      run: |
        # 归一化 raw 输入（忽略大小写与空白）：仅 "true" 启用 -r，其余值按非 raw 处理
        RAW_NORMALIZED=$(printf '%s' "$INPUT_RAW" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

        # 将所有参数转换为数组
        JQ_ARGS=()
        if [ "$RAW_NORMALIZED" = "true" ]; then
          JQ_ARGS+=(-r)
        fi

        # 将 options 按空白拆分为数组：read 不做 glob 展开，避免 '*' 被展开为文件名
        if [ -n "$INPUT_OPTIONS" ]; then
          read -ra OPTION_ARGS <<< "$INPUT_OPTIONS"
          JQ_ARGS+=("${OPTION_ARGS[@]}")
        fi

        # 检查是否为合法 JSON 字符串
        if printf '%s\n' "$INPUT_DATA" | jq . > /dev/null 2>&1; then
          # 是合法的 JSON 字符串
          RESULT=$(printf '%s\n' "$INPUT_DATA" | jq "${JQ_ARGS[@]}" "$INPUT_FILTER") || {
            echo "::error::jq command failed on JSON input"
            exit 1
          }
        # 检查是否为存在的文件
        elif [ -f "$INPUT_DATA" ]; then
          # 是存在的文件
          RESULT=$(jq "${JQ_ARGS[@]}" "$INPUT_FILTER" "$INPUT_DATA") || {
            echo "::error::jq command failed on file '$INPUT_DATA'"
            exit 1
          }
        else
          echo "::error::Input is neither a valid JSON string nor an existing file."
          exit 1
        fi

        # 检查 RESULT 是否包含换行符
        if [[ "$RESULT" = *$'\n'* ]]; then
          # 包含换行符，使用多行输出
          DELIMITER="JQMULTILINE$$_${RANDOM}_$(date +%s)"
          printf 'result<<%s\n' "$DELIMITER" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DELIMITER" >> "$GITHUB_OUTPUT"
          printf 'multiline=true\n' >> "$GITHUB_OUTPUT"
        else
          # 不包含换行符，使用普通输出
          printf 'result=%s\n' "$RESULT" >> "$GITHUB_OUTPUT"
          printf 'multiline=false\n' >> "$GITHUB_OUTPUT"
        fi
